name: Jellyfin MEGA Server

on:
  workflow_dispatch:  # allows manual run

jobs:
  run-jellyfin:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Install rclone
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      # 2️⃣ Setup rclone config
      - name: Setup rclone config
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF }}" > ~/.config/rclone/rclone.conf

      # 3️⃣ Mount MEGA
      - name: Mount MEGA
        run: |
          mkdir /mnt/media
          rclone mount "Mega:3TA" /mnt/media --vfs-cache-mode writes --daemon

      # 4️⃣ Install Jellyfin
      - name: Install Jellyfin
        run: |
          sudo apt update
          sudo apt install -y apt-transport-https software-properties-common wget
          wget -O - https://repo.jellyfin.org/ubuntu/jellyfin_team.gpg.key | sudo apt-key add -
          echo "deb [arch=$( dpkg --print-architecture )] https://repo.jellyfin.org/ubuntu $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/jellyfin.list
          sudo apt update
          sudo apt install -y jellyfin

      # 5️⃣ Start Jellyfin
      - name: Start Jellyfin
        run: sudo jellyfin &

      # 6️⃣ Install Ngrok and start public URL
      - name: Install Ngrok
        run: |
          curl -s https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-linux-amd64.zip -o ngrok.zip
          unzip ngrok.zip
          chmod +x ngrok
          ./ngrok authtoken ${{ secrets.NGROK_TOKEN }}
          ./ngrok http 8096 &
